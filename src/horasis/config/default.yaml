default_backend: ultralytics
telemetry_enabled: true

inputs:
  allow_urls: false          # network fetches of image URLs are opt-in
  max_bytes: 20971520
  max_pixels: 100000000
  apply_exif_orientation: true

moderation_threshold: 0.5

tiers:
  free:
    name: free
    quota:
      limit: 100
      window_seconds: 86400
    allowed_tasks: [detect, classify, ocr]

  pro:
    name: pro
    quota:
      limit: 10000
      window_seconds: 86400
    allowed_tasks: [detect, classify, ocr, face, moderate, segment, pose]

  enterprise:
    name: enterprise
    quota:
      limit: 1000000
      window_seconds: 86400
    allowed_tasks: [detect, classify, ocr, face, moderate, segment, pose]

extra: {}
