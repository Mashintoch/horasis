default_backend: ultralytics
telemetry_enabled: true

inputs:
  allow_urls: false          # network fetches of image URLs are opt-in
  max_bytes: 20971520
  max_pixels: 100000000
  apply_exif_orientation: true

# backend_order:             # per-praxis preference, first registered match wins
#   ocr: [easyocr, tesseract]
# fallback_order: [remote]

moderation_threshold: 0.5
# moderation_thresholds: {nsfw: 0.7}

tiers:
  free:
    name: free
    quota:
      limit: 100
      window_seconds: 86400
    allowed_praxeis: [detect, classify, ocr]

  pro:
    name: pro
    quota:
      limit: 10000
      window_seconds: 86400
    allowed_praxeis: [detect, classify, ocr, face, moderate, segment, pose]

  enterprise:
    name: enterprise
    quota:
      limit: 1000000
      window_seconds: 86400
    allowed_praxeis: [detect, classify, ocr, face, moderate, segment, pose]

extra: {}
