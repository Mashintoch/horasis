[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horasis"
dynamic = ["version"]
description = "A layered, plugin-friendly computer vision SDK with tiered, quota-aware access control."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Paul Chibueze" }]
keywords = [
    "computer-vision",
    "object-detection",
    "ocr",
    "sdk",
    "image-processing",
    "image-recognition",
    "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "typing_extensions>=4.6",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "numpy>=1.26",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/Mashintoch/horasis"
Repository = "https://github.com/Mashintoch/horasis"
Issues = "https://github.com/Mashintoch/horasis/issues"
Changelog = "https://github.com/Mashintoch/horasis/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ultralytics = ["ultralytics>=8.2"]
onnx = ["onnxruntime>=1.17"]
ocr = ["easyocr>=1.7", "pytesseract>=0.3.10"]
face = ["opencv-python>=4.8"]
moderation = ["transformers>=4.40", "torch>=2.2"]
remote = ["httpx>=0.27"]

video = ["opencv-python>=4.8"]
viz = ["opencv-python>=4.8", "imageio>=2.34", "imageio-ffmpeg>=0.5"]
redis = ["redis>=5.0"]
otel = ["opentelemetry-api>=1.24"]
server = ["fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn>=0.29"]

demographics = ["deepface>=0.0.93", "tf-keras>=2.15"]

all = [
    "horasis[ultralytics,onnx,ocr,face,moderation,remote,video,viz,redis,otel,server]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "pylint>=3.0",
    "types-PyYAML",
    "httpx>=0.27",
    "fakeredis[lua]>=2.23",
]

[project.scripts]
horasis = "horasis.cli:main"

# Third-party plugins register backends in their own pyproject.toml, e.g.:
# [project.entry-points."horasis.backends"]
# my_backend = "my_package.adapter:MyAdapter"

[tool.setuptools.dynamic]
version = { attr = "horasis.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
horasis = ["py.typed", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs real models/network; skipped unless run with -m integration",
]


[tool.mypy]
strict = true
packages = ["horasis"]

[[tool.mypy.overrides]]
module = [
    "cv2",
    "deepface",
    "deepface.*",
    "easyocr",
    "imageio",
    "imageio.*",
    "imageio_ffmpeg",
    "onnxruntime",
    "opentelemetry",
    "opentelemetry.*",
    "pytesseract",
    "redis",
    "transformers",
    "ultralytics",
    "ultralytics.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ultralytics"]
implicit_reexport = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pylint.main]
ignore-paths = ["^tests/.*$", "^examples/.*$"]
fail-under = 9.0

[tool.pylint.typecheck]
signature-mutators = ["horasis.access.guard.requires_access"]
# cv2 builds its API at import time, so pylint cannot see its members.
generated-members = ["cv2.*"]

[tool.pylint."messages control"]
disable = [
    "import-error",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-nested-blocks",
    "import-outside-toplevel",
    "invalid-name",
    "line-too-long",
    "duplicate-code",
    "cyclic-import",
    "unused-argument",
    "broad-exception-caught",
]
