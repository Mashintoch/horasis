[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horasis"
version = "1.0.0"
description = "A layered, plugin-friendly computer vision SDK with tiered, quota-aware access control."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Paul Chibueze" }]
keywords = ["computer-vision", "object-detection", "ocr", "sdk", "image-processing", "image-recognition", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "ultralytics>=8.2",
]

[project.optional-dependencies]
ultralytics = ["ultralytics>=8.2"]
onnx = ["onnxruntime>=1.17"]
remote = ["httpx>=0.27"]
viz = ["Pillow>=10.0", "opencv-python-headless>=4.8", "imageio>=2.34", "imageio-ffmpeg>=0.5"]
demographics = ["deepface>=0.0.93", "tf-keras>=2.15"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
]
all = ["horasis[ultralytics,onnx,remote,viz,demographics]"]

[project.urls]
Homepage = "https://github.com/mashintoch/horasis"
Issues = "https://github.com/mashintoch/horasis/issues"

# Plugins register backends here, e.g.:
# [project.entry-points."horasis.backends"]
# my_backend = "my_package.adapter:MyAdapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
horasis = ["py.typed", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["horasis"]

[tool.ruff]
line-length = 100
target-version = "py311"
